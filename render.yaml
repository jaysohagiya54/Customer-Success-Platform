services:
  - type: web
    name: csp-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: csp-postgres
          property: connectionString
      - key: REDIS_URL
        sync: false          # set manually from Upstash dashboard
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@example.com
      - key: ADMIN_PASSWORD
        sync: false          # set in Render dashboard
      - key: CORS_ORIGINS
        sync: false          # set to your Vercel frontend URL after deploy
      - key: OPENAI_API_KEY
        sync: false          # optional — leave blank to use heuristic fallback
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: PYTHON_VERSION
        value: "3.12.0"

databases:
  - name: csp-postgres
    databaseName: csp
    user: csp_user
    plan: free
